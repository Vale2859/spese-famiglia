<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14233a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bilancio Famiglia">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Bilancio Mensile Generale</title>
  <style>
    :root{
      --bg:#f3f6f9;--ink:#14233a;--muted:#6b7a8d;--green:#dff3e7;--greenInk:#0e7b49;
      --red:#fde7e7;--redInk:#b33131;--purple:#eee5fb;--purpleInk:#6f49a8;--line:#dde5ed;
      --gold:#fff1c9;--goldInk:#765200;--shadow:0 16px 38px rgba(20,35,58,.11)
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#f9fbfd,#edf2f6);color:var(--ink)}
    button,input,select{font:inherit} button{touch-action:manipulation}
    .app{width:min(100%,760px);margin:0 auto;min-height:100vh;padding:14px 14px calc(105px + env(safe-area-inset-bottom))}
    .header{text-align:center;padding:10px 6px 4px}
    .header h1{margin:0;font-size:clamp(32px,8vw,52px);line-height:1.02;font-weight:1000;letter-spacing:-.035em}
    .version{margin-top:7px;color:var(--muted);font-size:13px;font-weight:900}
    .months-wrap{margin:12px 0 10px;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:10px}
    .months{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .months::-webkit-scrollbar{display:none}
    .month-btn{flex:0 0 auto;min-width:108px;border:0;border-radius:14px;padding:11px 13px;background:#eef2f6;color:var(--ink);font-weight:950}
    .month-btn.active{background:#14233a;color:#fff}
    .month-year{display:block;font-size:12px;opacity:.75;margin-top:2px}
    .selected{font-size:18px;font-weight:1000;text-align:center;margin:9px 0 12px}
    .future-banner{display:none;background:var(--gold);color:var(--goldInk);padding:12px 14px;border-radius:14px;font-weight:900;text-align:center;margin-bottom:14px}
    .stack{display:grid;gap:16px}
    .big-card{border:0;border-radius:26px;padding:26px 20px;min-height:170px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
    .income{background:var(--green);color:var(--greenInk)}.expense{background:var(--red);color:var(--redInk)}.saving{background:var(--purple);color:var(--purpleInk)}
    .card-label{font-size:clamp(27px,6vw,41px);font-weight:1000;line-height:1}
    .card-value{font-size:clamp(46px,11vw,76px);font-weight:1000;line-height:.95;margin-top:17px;letter-spacing:-.04em}
    .card-note{font-size:14px;font-weight:850;opacity:.76;margin-top:10px}
    .backup{margin-top:14px;background:#eaf5ff;color:#175485;border-radius:14px;padding:11px 13px;font-size:13px;font-weight:850;text-align:center}
    .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:68px;height:68px;border:0;border-radius:50%;background:#14233a;color:#fff;font-size:38px;box-shadow:0 16px 34px rgba(20,35,58,.3);z-index:30}
    .modal{position:fixed;inset:0;background:rgba(10,20,32,.48);display:none;align-items:flex-end;justify-content:center;z-index:60}
    .modal.open{display:flex}
    .sheet{width:min(100%,760px);max-height:91vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:20px 18px calc(28px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(0,0,0,.22)}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .sheet-title{font-size:29px;font-weight:1000}
    .close{width:46px;height:46px;border:0;border-radius:14px;background:#eef2f6;font-size:21px}
    .detail-total{font-size:45px;font-weight:1000;margin:9px 0 16px;letter-spacing:-.04em}
    .section-title{font-size:19px;font-weight:1000;margin:20px 0 7px}
    .detail-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
    .detail-name{font-weight:950}.detail-sub{font-size:12px;color:var(--muted);font-weight:800;margin-top:3px}.detail-amount{font-weight:1000}
    .trash{border:0;border-radius:10px;background:#fee8e8;color:#a92c2c;padding:8px 10px;font-weight:900}
    .empty{text-align:center;color:var(--muted);padding:20px 0;font-weight:850}
    .month-badge{padding:13px 14px;border-radius:14px;background:#eef3f7;font-weight:1000;text-align:center;margin:14px 0}
    .form{display:grid;grid-template-columns:1.2fr .8fr;gap:10px}.full{grid-column:1/-1}
    input,select{width:100%;border:2px solid var(--line);border-radius:13px;padding:14px 13px;background:#fff;font-size:18px}
    .togglebox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f6f8fa;border-radius:14px;padding:14px;font-weight:900}
    .switch{width:58px;height:34px;border-radius:17px;background:#cfd8e2;padding:4px;cursor:pointer;transition:.2s}
    .switch.on{background:#177a4d}.knob{width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}.switch.on .knob{transform:translateX(24px)}
    .repeat-note{font-size:13px;color:var(--muted);font-weight:800;margin-top:8px}
    .add{width:100%;border:0;border-radius:14px;background:#14233a;color:#fff;padding:15px;font-weight:1000}
    .choice{display:grid;gap:10px;margin-top:16px}.choice button{border:0;border-radius:15px;padding:15px;font-weight:1000;text-align:left}
    .only{background:#eef3f7;color:#14233a}.forever{background:#fee8e8;color:#a92c2c}.cancel{background:#f5f5f5;color:#555}
    @media(max-width:520px){
      .app{padding:10px 10px calc(95px + env(safe-area-inset-bottom))}.big-card{min-height:160px;padding:22px 16px}.stack{gap:13px}.month-btn{min-width:98px}
      .fab{right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:62px;height:62px}.form{grid-template-columns:1fr}.full{grid-column:auto}
      .detail-row{grid-template-columns:1fr auto}.trash{grid-column:1/-1}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>BILANCIO MENSILE<br>GENERALE</h1>
    <div class="version">Versione 5 · avvio da settembre 2026</div>
  </div>

  <div class="months-wrap"><div class="months" id="monthsBar"></div></div>
  <div class="selected" id="selectedLabel"></div>
  <div class="future-banner" id="futureBanner">
    MESE FUTURO: le ricorrenze non sono ancora visibili. Qui vedrai solo eventuali voci inserite manualmente in anticipo.
  </div>

  <div class="stack">
    <button id="incomeCard" class="big-card income" type="button">
      <div class="card-label">ENTRATE</div><div class="card-value" id="incomeValue">€ 0</div><div class="card-note">Tocca per il dettaglio</div>
    </button>
    <button id="expenseCard" class="big-card expense" type="button">
      <div class="card-label">USCITE</div><div class="card-value" id="expenseValue">€ 0</div><div class="card-note">Fisse · Polizze · Fabbisogno</div>
    </button>
    <button id="savingCard" class="big-card saving" type="button">
      <div class="card-label">UTILE / RISPARMI</div><div class="card-value" id="savingValue">€ 0</div><div class="card-note">Vacanze · Extra · Risparmio</div>
    </button>
  </div>

  <div class="backup" id="backupStatus"></div>
</div>

<button class="fab" id="fab" type="button">+</button>

<div class="modal" id="detailModal">
  <div class="sheet">
    <div class="sheet-head"><div class="sheet-title" id="detailTitle"></div><button class="close" id="closeDetail">✕</button></div>
    <div class="detail-total" id="detailTotal"></div>
    <div id="detailContent"></div>
  </div>
</div>

<div class="modal" id="addModal">
  <div class="sheet">
    <div class="sheet-head"><div class="sheet-title">Aggiungi voce</div><button class="close" id="closeAdd">✕</button></div>
    <div class="month-badge" id="addMonthLabel"></div>
    <div class="form">
      <select id="newType">
        <option value="income">Entrata</option>
        <option value="fixed">Uscita fissa</option>
        <option value="policies">Uscita polizza</option>
        <option value="needs">Fabbisogno mensile</option>
      </select>
      <input id="newAmount" inputmode="decimal" type="number" min="0" step="0.01" placeholder="Importo €">
      <input id="newName" class="full" placeholder="Nome voce">
      <div class="togglebox full">
        <div>
          <div>Ripeti ogni mese</div>
          <div class="repeat-note" id="repeatText"></div>
        </div>
        <div class="switch on" id="repeatSwitch"><div class="knob"></div></div>
      </div>
      <button class="add full" id="addBtn">Aggiungi</button>
    </div>
  </div>
</div>

<div class="modal" id="deleteModal">
  <div class="sheet">
    <div class="sheet-head"><div class="sheet-title">Elimina voce</div><button class="close" id="closeDelete">✕</button></div>
    <div class="month-badge" id="deleteLabel"></div>
    <div class="choice">
      <button class="only" id="deleteOnly">🗓️ Elimina solo per questo mese</button>
      <button class="forever" id="deleteForever">🛑 Elimina da questo mese in poi</button>
      <button class="cancel" id="deleteCancel">Annulla</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const $=id=>document.getElementById(id);
  const KEY='bilancioFamigliaPWA_v5';
  const BACKUP_KEY='bilancioFamigliaPWA_dailyBackups_v5';
  const START='2026-01';
  const BASELINE='2026-09';
  const END='2100-12';
  const MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:2}).format(Number(n||0));

  let data;
  try{data=JSON.parse(localStorage.getItem(KEY)||'null')||null}catch(e){data=null}
  if(!data){
    data={months:{},rules:{},initialized:true};
    seedSeptember2026();
    localStorage.setItem(KEY,JSON.stringify(data));
  }
  if(!data.months)data.months={};
  if(!data.rules)data.rules={};

  function addSeedRule(type,name,amount){
    const id='seed-'+type+'-'+Math.random().toString(16).slice(2);
    data.rules[id]={id,type,name,amount,start:BASELINE,end:null,skipMonths:[]};
    return id;
  }

  function seedSeptember2026(){
    data.months[BASELINE]={income:[],fixed:[],policies:[],needs:[]};

    const seed = [
      ['income','Stipendio',3900],
      ['fixed','Garage Perrone',116],
      ['fixed','Condominio',80],
      ['fixed','Sky',40],
      ['fixed','Fastweb',30],
      ['fixed','Acqua / Luce / Gas',300],
      ['fixed','Emanuela',500],
      ['fixed','Suzuki Ignis finanziamento',374.40],
      ['policies','Polizza EY54591',38],
      ['policies','Polizza Ignis',55],
      ['policies','Polizza Honda SH',41],
      ['needs','Cibo',200],
      ['needs','Benzina',200]
    ];
    seed.forEach(([type,name,amount])=>{
      const rid=addSeedRule(type,name,amount);
      data.months[BASELINE][type].push({id:'i-'+rid+'-'+BASELINE,name,amount,ruleId:rid});
    });
  }

  const now=new Date();
  const realCurrentKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  let currentYear=Math.max(2026,now.getFullYear());
  let currentMonth=(currentYear===now.getFullYear()?now.getMonth():0);

  function mk(y=currentYear,m=currentMonth){return y+'-'+String(m+1).padStart(2,'0')}
  function splitKey(k){const [y,m]=k.split('-').map(Number);return {y,m:m-1}}
  function compareKey(a,b){return a.localeCompare(b)}
  function prevKey(k){const {y,m}=splitKey(k);const d=new Date(y,m-1,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
  function blank(){return {income:[],fixed:[],policies:[],needs:[]}}
  function monthLabel(k=mk()){const {y,m}=splitKey(k);return MONTHS[m]+' '+y}
  function isFuture(k=mk()){return compareKey(k,realCurrentKey)>0}

  function ruleActive(rule,k){
    if(compareKey(k,rule.start)<0)return false;
    if(rule.end && compareKey(k,rule.end)>0)return false;
    if((rule.skipMonths||[]).includes(k))return false;
    return true
  }

  function ensureMonthContainer(k){
    if(!data.months[k])data.months[k]=blank();
  }

  function materializeRecurringIfDue(k){
    if(compareKey(k,BASELINE)<0)return;      // gennaio-agosto 2026 restano vuoti
    if(compareKey(k,realCurrentKey)>0)return; // mesi futuri: niente ricorrenze in anticipo
    ensureMonthContainer(k);
    Object.values(data.rules).forEach(rule=>{
      if(!ruleActive(rule,k))return;
      const a=data.months[k][rule.type];
      if(!a.some(x=>x.ruleId===rule.id)){
        a.push({id:'i-'+rule.id+'-'+k,name:rule.name,amount:rule.amount,ruleId:rule.id});
      }
    });
  }

  function getItems(type,k=mk()){
    if(compareKey(k,BASELINE)>=0 && compareKey(k,realCurrentKey)<=0){
      materializeRecurringIfDue(k);
    }else{
      ensureMonthContainer(k); // permette voci manuali anche nei mesi futuri
    }
    return data.months[k][type]||[];
  }

  function save(){
    localStorage.setItem(KEY,JSON.stringify(data));
    dailyBackup();
    render();
  }
  function sum(type){return getItems(type).reduce((s,x)=>s+Number(x.amount||0),0)}
  function allExpenses(){return sum('fixed')+sum('policies')+sum('needs')}

  function renderMonths(){
    const bar=$('monthsBar');bar.innerHTML='';
    for(let y=2026;y<=2100;y++){
      for(let m=0;m<12;m++){
        const k=y+'-'+String(m+1).padStart(2,'0');
        if(compareKey(k,START)<0||compareKey(k,END)>0)continue;
        const b=document.createElement('button');
        b.type='button';b.className='month-btn'+(y===currentYear&&m===currentMonth?' active':'');
        b.innerHTML=MONTHS[m]+'<span class="month-year">'+y+'</span>';
        b.addEventListener('click',()=>{currentYear=y;currentMonth=m;render()});
        bar.appendChild(b);
      }
    }
    requestAnimationFrame(()=>{const a=bar.querySelector('.active');if(a)a.scrollIntoView({inline:'center',block:'nearest'})});
  }

  function render(){
    if(compareKey(mk(),BASELINE)>=0 && compareKey(mk(),realCurrentKey)<=0)materializeRecurringIfDue(mk());
    else ensureMonthContainer(mk());

    renderMonths();
    $('selectedLabel').textContent='MESE SELEZIONATO: '+monthLabel().toUpperCase();
    $('futureBanner').style.display=isFuture()?'block':'none';
    $('incomeValue').textContent=euro(sum('income'));
    $('expenseValue').textContent=euro(allExpenses());
    $('savingValue').textContent=euro(sum('income')-allExpenses());
    updateBackupStatus();
  }

  function makeRow(type,item){
    const row=document.createElement('div');row.className='detail-row';
    const nameBox=document.createElement('div');
    const name=document.createElement('div');name.className='detail-name';name.textContent=item.name;
    const sub=document.createElement('div');sub.className='detail-sub';
    sub.textContent=item.ruleId?'Ricorrente ogni mese':'Solo questo mese';
    nameBox.append(name,sub);
    const amount=document.createElement('div');amount.className='detail-amount';amount.textContent=euro(item.amount);
    const del=document.createElement('button');del.type='button';del.className='trash';del.textContent='Elimina';
    del.addEventListener('click',()=>requestDelete(type,item));
    row.append(nameBox,amount,del);return row
  }

  function openIncome(){
    lastDetail='income';
    $('detailTitle').textContent='Entrate · '+monthLabel();
    $('detailTotal').textContent=euro(sum('income'));
    const c=$('detailContent');c.innerHTML='';
    const items=getItems('income');
    if(!items.length)c.innerHTML='<div class="empty">Nessuna entrata.</div>';else items.forEach(x=>c.appendChild(makeRow('income',x)));
    $('detailModal').classList.add('open')
  }

  function openExpenses(){
    lastDetail='expenses';
    $('detailTitle').textContent='Uscite · '+monthLabel();
    $('detailTotal').textContent=euro(allExpenses());
    const c=$('detailContent');c.innerHTML='';
    [['USCITE FISSE','fixed'],['USCITE POLIZZE','policies'],['FABBISOGNO MENSILE','needs']].forEach(([label,type])=>{
      const h=document.createElement('div');h.className='section-title';h.textContent=label+' · '+euro(sum(type));c.appendChild(h);
      const items=getItems(type);
      if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent='Nessuna voce.';c.appendChild(e)}
      else items.forEach(x=>c.appendChild(makeRow(type,x)))
    });
    $('detailModal').classList.add('open')
  }

  function openSavings(){
    lastDetail='savings';
    const inc=sum('income'),exp=allExpenses();
    $('detailTitle').textContent='Utile / Risparmi · '+monthLabel();
    $('detailTotal').textContent=euro(inc-exp);
    $('detailContent').innerHTML=
      '<div class="detail-row"><div class="detail-name">Entrate totali</div><div class="detail-amount">'+euro(inc)+'</div><div></div></div>'+
      '<div class="detail-row"><div class="detail-name">Uscite totali</div><div class="detail-amount">'+euro(exp)+'</div><div></div></div>'+
      '<div class="detail-row"><div class="detail-name">Disponibile</div><div class="detail-amount">'+euro(inc-exp)+'</div><div></div></div>';
    $('detailModal').classList.add('open')
  }

  let repeatMonthly=true,pendingDelete=null,lastDetail='';

  function reopenDetail(){if(lastDetail==='income')openIncome();else if(lastDetail==='expenses')openExpenses();else if(lastDetail==='savings')openSavings()}

  function openAdd(){
    repeatMonthly=true;updateRepeatUI();
    $('addMonthLabel').textContent='STAI REGISTRANDO SU: '+monthLabel().toUpperCase();
    $('addModal').classList.add('open')
  }
  function updateRepeatUI(){
    $('repeatSwitch').classList.toggle('on',repeatMonthly);
    if(repeatMonthly){
      $('repeatText').textContent=isFuture()
        ?'La ricorrenza partirà da '+monthLabel()+'. Non sarà mostrata prima che quel mese arrivi.'
        :'La voce viene salvata in '+monthLabel()+' e si ripeterà automaticamente nei mesi successivi quando arriveranno.';
    }else{
      $('repeatText').textContent='La voce resterà soltanto in '+monthLabel()+'.';
    }
  }

  function addItem(){
    const type=$('newType').value,name=$('newName').value.trim(),amount=Number($('newAmount').value);
    if(!name||amount<=0){alert('Inserisci nome e importo.');return}
    const k=mk();ensureMonthContainer(k);

    if(repeatMonthly){
      const id='r-'+Date.now()+'-'+Math.random().toString(16).slice(2);
      data.rules[id]={id,type,name,amount,start:k,end:null,skipMonths:[]};
      // Se il mese è già arrivato, mostra subito la prima occorrenza.
      if(compareKey(k,realCurrentKey)<=0){
        data.months[k][type].push({id:'i-'+id+'-'+k,name,amount,ruleId:id});
      }
      // Se è futuro, resta invisibile finché non arriva quel mese.
    }else{
      data.months[k][type].push({id:'o-'+Date.now(),name,amount});
    }

    $('newName').value='';$('newAmount').value='';$('addModal').classList.remove('open');save()
  }

  function requestDelete(type,item){
    pendingDelete={type,item};
    $('deleteLabel').textContent=item.name+' · '+monthLabel();
    $('detailModal').classList.remove('open');
    if(item.ruleId){
      $('deleteOnly').style.display='block';$('deleteOnly').textContent='🗓️ Elimina solo per questo mese';
      $('deleteForever').style.display='block';
    }else{
      $('deleteOnly').style.display='block';$('deleteOnly').textContent='🗑️ Elimina questa voce';
      $('deleteForever').style.display='none';
    }
    $('deleteModal').classList.add('open')
  }

  function deleteOnly(){
    if(!pendingDelete)return;
    const {type,item}=pendingDelete,k=mk();
    data.months[k][type]=data.months[k][type].filter(x=>x.id!==item.id);
    if(item.ruleId){
      const rule=data.rules[item.ruleId];
      if(rule){
        if(!rule.skipMonths)rule.skipMonths=[];
        if(!rule.skipMonths.includes(k))rule.skipMonths.push(k);
      }
    }
    finishDelete()
  }

  function deleteForever(){
    if(!pendingDelete||!pendingDelete.item.ruleId)return;
    const {type,item}=pendingDelete,k=mk();
    const rule=data.rules[item.ruleId];
    if(rule)rule.end=prevKey(k);
    Object.keys(data.months).forEach(month=>{
      if(compareKey(month,k)>=0){
        data.months[month][type]=data.months[month][type].filter(x=>x.ruleId!==item.ruleId)
      }
    });
    finishDelete()
  }

  function finishDelete(){
    pendingDelete=null;$('deleteModal').classList.remove('open');save();setTimeout(reopenDetail,0)
  }

  function dailyBackup(){
    const d=new Date(),day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    let b=[];try{b=JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]')}catch(e){}
    const snap={date:day,createdAt:new Date().toISOString(),data:JSON.parse(JSON.stringify(data))};
    const i=b.findIndex(x=>x.date===day);if(i>=0)b[i]=snap;else b.push(snap);
    b.sort((a,c)=>a.date.localeCompare(c.date));if(b.length>60)b=b.slice(-60);
    localStorage.setItem(BACKUP_KEY,JSON.stringify(b))
  }
  function updateBackupStatus(){
    let b=[];try{b=JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]')}catch(e){}
    const last=b[b.length-1];
    $('backupStatus').textContent=last?'Backup automatico locale: ultimo '+last.date+' · '+b.length+' copie giornaliere conservate.':'Backup automatico locale attivo.'
  }

  $('incomeCard').addEventListener('click',openIncome);
  $('expenseCard').addEventListener('click',openExpenses);
  $('savingCard').addEventListener('click',openSavings);
  $('fab').addEventListener('click',openAdd);
  $('closeDetail').addEventListener('click',()=>$('detailModal').classList.remove('open'));
  $('closeAdd').addEventListener('click',()=>$('addModal').classList.remove('open'));
  $('repeatSwitch').addEventListener('click',()=>{repeatMonthly=!repeatMonthly;updateRepeatUI()});
  $('addBtn').addEventListener('click',addItem);
  $('closeDelete').addEventListener('click',()=>{$('deleteModal').classList.remove('open');reopenDetail()});
  $('deleteCancel').addEventListener('click',()=>{$('deleteModal').classList.remove('open');reopenDetail()});
  $('deleteOnly').addEventListener('click',deleteOnly);
  $('deleteForever').addEventListener('click',deleteForever);

  dailyBackup();render();

  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))
  }
})();
</script>
</body>
