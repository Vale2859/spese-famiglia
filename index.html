<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14233a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bilancio Famiglia">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Bilancio Mensile Generale</title>
  <style>
    :root{
      --bg:#f3f6f9; --ink:#14233a; --muted:#6b7a8d; --green:#dff3e7; --green-ink:#0e7b49;
      --red:#fde7e7; --red-ink:#b33131; --purple:#eee5fb; --purple-ink:#6f49a8;
      --line:#dde5ed; --shadow:0 16px 38px rgba(20,35,58,.11);
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,#f9fbfd 0%,#edf2f6 100%);
      color:var(--ink)
    }
    button,input,select{font:inherit}
    button{touch-action:manipulation}
    .app{width:min(100%,760px);margin:0 auto;min-height:100vh;padding:14px 14px calc(100px + env(safe-area-inset-bottom))}
    .header{text-align:center;padding:12px 8px 8px}
    .header h1{margin:0;font-size:clamp(32px,8vw,52px);line-height:1.02;font-weight:1000;letter-spacing:-.035em}
    .months-wrap{margin:12px 0 18px;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:10px}
    .months{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .months::-webkit-scrollbar{display:none}
    .month-btn{flex:0 0 auto;min-width:110px;border:0;border-radius:14px;padding:11px 13px;background:#eef2f6;color:var(--ink);font-weight:950}
    .month-btn.active{background:#14233a;color:#fff}
    .month-year{display:block;font-size:12px;opacity:.75;margin-top:2px}
    .stack{display:grid;grid-template-columns:1fr;gap:18px}
    .big-card{
      border:0;border-radius:26px;padding:28px 22px;box-shadow:var(--shadow);min-height:180px;
      cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center
    }
    .big-card.income{background:var(--green);color:var(--green-ink)}
    .big-card.expense{background:var(--red);color:var(--red-ink)}
    .big-card.saving{background:var(--purple);color:var(--purple-ink)}
    .card-label{font-size:clamp(28px,6vw,42px);line-height:1;font-weight:1000}
    .card-value{margin-top:18px;font-size:clamp(46px,11vw,78px);line-height:.95;font-weight:1000;letter-spacing:-.04em}
    .card-note{margin-top:10px;font-weight:800;font-size:14px;opacity:.75}
    .fab{
      position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:68px;height:68px;border-radius:50%;
      border:0;background:#14233a;color:white;font-size:38px;line-height:1;box-shadow:0 16px 34px rgba(20,35,58,.3);z-index:30
    }
    .modal{position:fixed;inset:0;background:rgba(10,20,32,.48);display:none;align-items:flex-end;justify-content:center;z-index:50}
    .modal.open{display:flex}
    .sheet{
      width:min(100%,760px);max-height:90vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;
      padding:20px 18px calc(28px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(0,0,0,.22)
    }
    .sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .sheet-title{font-size:30px;font-weight:1000}
    .close{width:48px;height:48px;border:0;border-radius:14px;background:#eef2f6;font-size:22px}
    .detail-total{font-size:46px;font-weight:1000;margin:10px 0 16px;letter-spacing:-.04em}
    .section-title{font-size:18px;font-weight:1000;margin:18px 0 8px}
    .detail-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
    .detail-name{font-weight:900}.detail-amount{font-weight:1000}
    .del{border:0;border-radius:10px;background:#fee8e8;color:#a92c2c;padding:8px 10px;font-weight:900}
    .form{display:grid;grid-template-columns:1.2fr .8fr;gap:10px;margin-top:14px}
    .form .full{grid-column:1/-1}
    input,select{width:100%;border:2px solid var(--line);border-radius:13px;padding:14px 13px;background:#fff;font-size:18px}
    .add{width:100%;border:0;border-radius:14px;background:#14233a;color:#fff;padding:15px;font-weight:1000}
    .empty{text-align:center;color:var(--muted);padding:20px 0;font-weight:800}
    .install-note{
      margin:14px 0 0;padding:12px 14px;border-radius:14px;background:#fff7d8;color:#715500;
      font-size:14px;font-weight:800;display:none
    }
    @media(max-width:520px){
      .app{padding:10px 10px calc(90px + env(safe-area-inset-bottom))}
      .big-card{min-height:165px;padding:24px 16px}.stack{gap:14px}
      .months-wrap{margin-bottom:14px}.month-btn{min-width:100px}
      .fab{right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:62px;height:62px}
      .form{grid-template-columns:1fr}.form .full{grid-column:auto}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>BILANCIO MENSILE<br>GENERALE</h1>
  </div>

  <div class="months-wrap">
    <div class="months" id="monthsBar"></div>
  </div>

  <div class="install-note" id="installNote">
    Su iPhone: apri questa pagina in Safari → Condividi → “Aggiungi alla schermata Home”.
  </div>

  <div class="stack">
    <button id="incomeCard" class="big-card income" type="button">
      <div class="card-label">ENTRATE</div>
      <div class="card-value" id="incomeValue">€ 0</div>
      <div class="card-note">Tocca per vedere il dettaglio</div>
    </button>

    <button id="expenseCard" class="big-card expense" type="button">
      <div class="card-label">USCITE</div>
      <div class="card-value" id="expenseValue">€ 0</div>
      <div class="card-note">Tocca per vedere tutte le spese</div>
    </button>

    <button id="savingCard" class="big-card saving" type="button">
      <div class="card-label">UTILE / RISPARMI</div>
      <div class="card-value" id="savingValue">€ 0</div>
      <div class="card-note">Disponibile per vacanze, extra e risparmio</div>
    </button>
  </div>
</div>

<button id="fab" class="fab" type="button" aria-label="Aggiungi voce">+</button>

<div class="modal" id="detailModal" aria-hidden="true">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title" id="detailTitle"></div>
      <button id="closeDetailBtn" class="close" type="button">✕</button>
    </div>
    <div class="detail-total" id="detailTotal"></div>
    <div id="detailContent"></div>
  </div>
</div>

<div class="modal" id="addModal" aria-hidden="true">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">Aggiungi voce</div>
      <button id="closeAddBtn" class="close" type="button">✕</button>
    </div>
    <div class="form">
      <select id="newType">
        <option value="income">Entrata</option>
        <option value="fixed">Uscita fissa</option>
        <option value="policies">Uscita polizza</option>
        <option value="needs">Fabbisogno mensile</option>
      </select>
      <input id="newAmount" inputmode="decimal" type="number" min="0" step="0.01" placeholder="Importo €">
      <input class="full" id="newName" placeholder="Nome voce">
      <button id="addBtn" class="add full" type="button">Aggiungi</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const $ = (id) => document.getElementById(id);
  const KEY = 'bilancioFamigliaPWA_v1';
  const MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const euro = (n) => new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:2}).format(Number(n||0));

  let data;
  try {
    data = JSON.parse(localStorage.getItem(KEY) || 'null') || {months:{}};
  } catch(e) {
    data = {months:{}};
  }

  const now = new Date();
  let currentYear = now.getFullYear();
  let currentMonth = now.getMonth();

  function monthKey(){
    return currentYear + '-' + String(currentMonth + 1).padStart(2,'0');
  }

  function defaultMonth(){
    return {
      income:[{id:1,name:'Stipendio',amount:3900}],
      fixed:[
        {id:2,name:'Garage Perrone',amount:116},
        {id:3,name:'Condominio',amount:80},
        {id:4,name:'Sky',amount:40},
        {id:5,name:'Fastweb',amount:30},
        {id:6,name:'Acqua / Luce / Gas',amount:300},
        {id:7,name:'Emanuela',amount:500},
        {id:8,name:'Suzuki Ignis finanziamento',amount:374.40}
      ],
      policies:[
        {id:9,name:'Polizza EY54591',amount:38},
        {id:10,name:'Polizza Ignis',amount:55},
        {id:11,name:'Polizza Honda SH',amount:41}
      ],
      needs:[
        {id:12,name:'Cibo',amount:200},
        {id:13,name:'Benzina',amount:200}
      ]
    };
  }

  function ensureMonth(){
    const k = monthKey();
    if(!data.months[k]){
      data.months[k] = defaultMonth();
    }
  }

  function save(){
    localStorage.setItem(KEY, JSON.stringify(data));
    render();
  }

  function sum(type){
    return data.months[monthKey()][type].reduce((s,x)=>s+Number(x.amount||0),0);
  }

  function allExpenses(){
    return sum('fixed') + sum('policies') + sum('needs');
  }

  function renderMonths(){
    const bar = $('monthsBar');
    bar.innerHTML = '';
    const items = [];
    for(let offset=-12; offset<=24; offset++){
      const d = new Date(now.getFullYear(), now.getMonth()+offset, 1);
      items.push({y:d.getFullYear(),m:d.getMonth()});
    }
    items.forEach((x)=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'month-btn' + (x.y===currentYear && x.m===currentMonth ? ' active' : '');
      b.innerHTML = MONTHS[x.m] + '<span class="month-year">' + x.y + '</span>';
      b.addEventListener('click', ()=>{
        currentYear = x.y;
        currentMonth = x.m;
        ensureMonth();
        render();
      });
      bar.appendChild(b);
    });
    setTimeout(()=>{
      const active = bar.querySelector('.active');
      if(active) active.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
    }, 0);
  }

  function render(){
    ensureMonth();
    renderMonths();
    $('incomeValue').textContent = euro(sum('income'));
    $('expenseValue').textContent = euro(allExpenses());
    $('savingValue').textContent = euro(sum('income') - allExpenses());
  }

  function rowHtml(type, x){
    const row = document.createElement('div');
    row.className = 'detail-row';

    const name = document.createElement('div');
    name.className = 'detail-name';
    name.textContent = x.name;

    const amount = document.createElement('div');
    amount.className = 'detail-amount';
    amount.textContent = euro(x.amount);

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.textContent = 'Elimina';
    del.addEventListener('click', ()=>{
      if(!confirm('Eliminare questa voce?')) return;
      data.months[monthKey()][type] = data.months[monthKey()][type].filter(i=>i.id!==x.id);
      save();
      if(type==='income') openIncome(); else openExpenses();
    });

    row.append(name, amount, del);
    return row;
  }

  function openIncome(){
    $('detailTitle').textContent = 'Entrate · ' + MONTHS[currentMonth] + ' ' + currentYear;
    $('detailTotal').textContent = euro(sum('income'));
    const c = $('detailContent');
    c.innerHTML = '';
    const items = data.months[monthKey()].income;
    if(!items.length){
      c.innerHTML = '<div class="empty">Nessuna entrata.</div>';
    } else {
      items.forEach(x=>c.appendChild(rowHtml('income',x)));
    }
    $('detailModal').classList.add('open');
    $('detailModal').setAttribute('aria-hidden','false');
  }

  function openExpenses(){
    $('detailTitle').textContent = 'Uscite · ' + MONTHS[currentMonth] + ' ' + currentYear;
    $('detailTotal').textContent = euro(allExpenses());
    const c = $('detailContent');
    c.innerHTML = '';

    [['USCITE FISSE','fixed'],['USCITE POLIZZE','policies'],['FABBISOGNO MENSILE','needs']].forEach(([label,type])=>{
      const h = document.createElement('div');
      h.className = 'section-title';
      h.textContent = label + ' · ' + euro(sum(type));
      c.appendChild(h);

      const items = data.months[monthKey()][type];
      if(!items.length){
        const e = document.createElement('div');
        e.className = 'empty';
        e.textContent = 'Nessuna voce.';
        c.appendChild(e);
      } else {
        items.forEach(x=>c.appendChild(rowHtml(type,x)));
      }
    });
    $('detailModal').classList.add('open');
    $('detailModal').setAttribute('aria-hidden','false');
  }

  function openSavings(){
    const inc = sum('income');
    const exp = allExpenses();
    $('detailTitle').textContent = 'Utile / Risparmi · ' + MONTHS[currentMonth] + ' ' + currentYear;
    $('detailTotal').textContent = euro(inc-exp);
    $('detailContent').innerHTML =
      '<div class="detail-row"><div class="detail-name">Entrate totali</div><div class="detail-amount">'+euro(inc)+'</div><div></div></div>'+
      '<div class="detail-row"><div class="detail-name">Uscite totali</div><div class="detail-amount">'+euro(exp)+'</div><div></div></div>'+
      '<div class="detail-row"><div class="detail-name">Disponibile</div><div class="detail-amount">'+euro(inc-exp)+'</div><div></div></div>';
    $('detailModal').classList.add('open');
    $('detailModal').setAttribute('aria-hidden','false');
  }

  function closeDetail(){
    $('detailModal').classList.remove('open');
    $('detailModal').setAttribute('aria-hidden','true');
  }

  function openAdd(){
    $('addModal').classList.add('open');
    $('addModal').setAttribute('aria-hidden','false');
    setTimeout(()=>$('newName').focus(),100);
  }

  function closeAdd(){
    $('addModal').classList.remove('open');
    $('addModal').setAttribute('aria-hidden','true');
  }

  function addItem(){
    const type = $('newType').value;
    const name = $('newName').value.trim();
    const amount = Number($('newAmount').value);
    if(!name || amount<=0){
      alert('Inserisci nome e importo.');
      return;
    }
    data.months[monthKey()][type].push({id:Date.now(),name,amount});
    $('newName').value='';
    $('newAmount').value='';
    closeAdd();
    save();
  }

  $('incomeCard').addEventListener('click', openIncome);
  $('expenseCard').addEventListener('click', openExpenses);
  $('savingCard').addEventListener('click', openSavings);
  $('fab').addEventListener('click', openAdd);
  $('closeDetailBtn').addEventListener('click', closeDetail);
  $('closeAddBtn').addEventListener('click', closeAdd);
  $('addBtn').addEventListener('click', addItem);

  $('detailModal').addEventListener('click', (e)=>{ if(e.target === $('detailModal')) closeDetail(); });
  $('addModal').addEventListener('click', (e)=>{ if(e.target === $('addModal')) closeAdd(); });

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(!isStandalone){
    $('installNote').style.display='block';
  }

  render();
})();
</script>
</body>
</html>
